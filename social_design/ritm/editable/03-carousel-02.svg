<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-label="Карусель 02: Не гонка. Практика."><title>Карусель 02: Не гонка. Практика.</title><defs></defs><style>text{font-family:Arial,Helvetica,sans-serif}</style><rect x="0" y="0" width="1080" height="1350" fill="#224CF2" rx="0"/><text x="60" y="110" font-size="76" fill="#F6F7FB" font-weight="700" letter-spacing="-4">RITM</text><text x="63" y="150" font-size="21" fill="#F6F7FB" font-weight="500" letter-spacing="2">СТУДИЯ ПИЛАТЕСА</text><text x="860" y="105" font-size="25" fill="#F6F7FB" font-weight="500" letter-spacing="0">02 / 03</text><text x="60" y="335" font-size="132" fill="#F6F7FB" font-weight="700" letter-spacing="-5.5440000000000005">НЕ ГОНКА.</text><text x="60" y="472" font-size="132" fill="#F6F7FB" font-weight="700" letter-spacing="-5.5440000000000005">ПРАКТИКА.</text><rect x="60" y="551" width="70" height="64" fill="#D7FF3F" rx="0"/><text x="77" y="595" font-size="28" fill="#12141C" font-weight="700" letter-spacing="0">01</text><text x="160" y="595" font-size="46" fill="#F6F7FB" font-weight="700" letter-spacing="-1">Дышим. Не спешим.</text><text x="160" y="648" font-size="30" fill="#F6F7FB" font-weight="400" letter-spacing="0">Слушаем подсказки инструктора.</text><path d="M160 687H1020" stroke="#ffffff" stroke-opacity=".3"/><rect x="60" y="715" width="70" height="64" fill="#D7FF3F" rx="0"/><text x="77" y="759" font-size="28" fill="#12141C" font-weight="700" letter-spacing="0">02</text><text x="160" y="759" font-size="46" fill="#F6F7FB" font-weight="700" letter-spacing="-1">Замечаем движение.</text><text x="160" y="812" font-size="30" fill="#F6F7FB" font-weight="400" letter-spacing="0">Важнее внимание, а не скорость.</text><path d="M160 851H1020" stroke="#ffffff" stroke-opacity=".3"/><rect x="60" y="879" width="70" height="64" fill="#D7FF3F" rx="0"/><text x="77" y="923" font-size="28" fill="#12141C" font-weight="700" letter-spacing="0">03</text><text x="160" y="923" font-size="46" fill="#F6F7FB" font-weight="700" letter-spacing="-1">Выбираем свой темп.</text><text x="160" y="976" font-size="30" fill="#F6F7FB" font-weight="400" letter-spacing="0">Говорим, если нужно сделать паузу.</text><path d="M160 1015H1020" stroke="#ffffff" stroke-opacity=".3"/><rect x="60" y="1115" width="140" height="66" fill="#F6F7FB" rx="0"/><rect x="305" y="1115" width="225" height="66" fill="#F6F7FB" rx="0"/><rect x="550" y="1115" width="225" height="66" fill="#F6F7FB" rx="0"/><rect x="795" y="1115" width="225" height="66" fill="#F6F7FB" rx="0"/><text x="60" y="1270" font-size="32" fill="#F6F7FB" font-weight="400" letter-spacing="0">Меньше спешки. Больше внимания.</text><path d="M928 1253h64m-25-25 25 25-25 25" fill="none" stroke="#F6F7FB" stroke-width="7"/></svg>